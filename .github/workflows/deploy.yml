name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# صلاحيات النشر على Pages عبر OIDC — لا حاجة لأي توكن يدوي.
permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في كل مرة، بلا إلغاء نشرة جارية.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # يحسب base_path تلقائيًا: '/<repo>' لموقع مشروع، وفارغ لموقع
      # <user>.github.io. لا أحد يحتاج تعديل الإعداد يدويًا.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build static export
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx next build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
